name: Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: sytone/issue8
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build plugin
        run: pnpm run build
      
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-plugin
          path: |
            main.js
            manifest.json
            styles.css
